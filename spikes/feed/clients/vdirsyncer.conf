# vdirsyncer: our read-only CalDAV feed -> local vdir. Run via clients/vdirsyncer.sh
[general]
status_path = "/private/tmp/claude-501/-Users-user-work-playground-supercal/2c9dfad9-ad70-4f53-9d6c-07256ea8bfe7/scratchpad/vds/status/"

[pair feed]
a = "feed_remote"
b = "feed_local"
collections = ["from a"]
conflict_resolution = "a wins"

[storage feed_remote]
type = "caldav"
url = "http://localhost:5232/"
username = "meridian"
password = "meridian-app-pw"
read_only = true

[storage feed_local]
type = "filesystem"
path = "/private/tmp/claude-501/-Users-user-work-playground-supercal/2c9dfad9-ad70-4f53-9d6c-07256ea8bfe7/scratchpad/vds/cals/"
fileext = ".ics"
